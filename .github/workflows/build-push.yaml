on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  push-store-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: 
          - type: runner
            name: ubuntu-build
          - type: devcontainer
            name: ubuntu-build-devcontainer
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@main

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: 'Build Inventory Image'
        env:
          IMAGE: ${{ matrix.image.type }}
          NAME: ${{ matrix.image.name }}
        run: |
          docker build . -f Dockerfile.${IMAGE} --tag ghcr.io/mnestor/${NAME}:latest
          docker push ghcr.io/mnestor/${NAME}:latest